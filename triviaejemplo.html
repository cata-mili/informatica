<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Trivia de Conocimientos Generales</h1>
    <h2>1. ¿Quién pintó la Mona Lisa?</h2>
    <input type="radio" name="p1" value="a"> Leonardo Da Vinci<br>
    <input type="radio" name="p1" value="b"> Picasso<br>
    <input type="radio" name="p1" value="c"> Miguel Angel<br>
    <h2>2. ¿Cuál es el país más grande territorialmente?</h2>
    <input type="radio" name="p2" value="a"> China<br>
    <input type="radio" name="p2" value="b"> Canadá<br>
    <input type="radio" name="p2" value="c"> Rusia<br>
    <h2>3. ¿Cuántos lados tiene un hexágono?</h2>
    <input type="radio" name="p3" value="a"> 5<br>
    <input type="radio" name="p3" value="b"> 6<br>
    <input type="radio" name="p3" value="c"> 7<br>
    <br>
    <button id="comprobar" type="button">Comprobar</button>
    <button id="reiniciar" type="button">Reiniciar</button>
    <p id="resultado"></p>
    <script>
    document.getElementById("comprobar").addEventListener("click", function() {
    let puntaje = 0;
    let p1 = document.querySelector('input[name="p1"]:checked');
    let p2 = document.querySelector('input[name="p2"]:checked');
    let p3 = document.querySelector('input[name="p3"]:checked');
    if (!p1 || !p2 || !p3) {
    document.getElementById("resultado").innerHTML =
    "Debes responder las tres preguntas.";
    return;
    }
    // Respuestas correctas
    if (p1.value === "a") puntaje++;
    if (p2.value === "c") puntaje++;
    if (p3.value === "b") puntaje++;
    let mensaje = "<h3>Resultado: " + puntaje + "/3 puntos</h3>";
    if (puntaje === 3) {
    mensaje += "¡Felicitaciones! Has respondido correctamente todas las preguntas.";
    } else if (puntaje === 2) {
    mensaje += "Buen intento. Solo te equivocaste en una pregunta.";
    } else {
    mensaje += "Te invito a intentarlo nuevamente.";
    }
    document.getElementById("resultado").innerHTML = mensaje;
    });
    document.getElementById("reiniciar").addEventListener("click", function() {
    let opciones = document.querySelectorAll('input[type="radio"]');
    for (let opcion of opciones) {
    opcion.checked = false;
    }
    document.getElementById("resultado").innerHTML = "";
    });
    </script>
    </body>
</html>
